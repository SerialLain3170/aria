pretrained_model_name_or_path: /data/shasegawa/t2a/models/Wan2.2-I2V-A14B-Diffusers
output_dir: /data/shasegawa/t2a/outputs/wan22-anita-production-lora-33f-288x512-8fps-high-balanced-r1

tasks: line_art,character_color,compose_refine
height: 288
width: 512
num_frames: 33
fps: 8

train_batch_size: 1
gradient_accumulation_steps: 12
max_train_steps: 4000
checkpointing_steps: 500

learning_rate: 0.00005
adam_weight_decay: 0.0001
lr_scheduler: cosine
lr_warmup_steps: 200
max_grad_norm: 1.0

rank: 32
lora_alpha: 32
lora_dropout: 0.05
target_modules: to_q,to_k,to_v,to_out.0,ffn.net.0.proj,ffn.net.2
train_stage: high

# Avoid silently training text-only line-art too often on this small dataset.
first_frame_prob: 0.9
reference_prob: 0.1
condition_dropout_prob: 0.0
text_drop_prob: 0.0

# Anita is imbalanced: line_art=306, character_color=183, compose_refine=39.
# Balanced sampling prevents the final composition task from being under-trained.
task_sampling: balanced
# Slightly oversample compose/refine because it has the smallest set and drives the final visual quality.
task_weights: line_art=1,character_color=1,compose_refine=2

mixed_precision: bf16
seed: 1337
dataloader_num_workers: 4
gradient_checkpointing: true
enable_vae_tiling: true
max_sequence_length: 512
